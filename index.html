<title>Karthik Class Room — Built by Agents</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#070707;--fg:#f3f0ec;--red:#e43b2f;--muted:#99928d;--line:#282321}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;background:transparent;color:var(--fg);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;isolation:isolate;position:relative}body:before,body:after{content:'';position:fixed;inset:-18%;pointer-events:none;z-index:-2}body:before{opacity:.68;background:radial-gradient(ellipse at 18% 28%,rgba(190,43,48,.20),transparent 34%),radial-gradient(ellipse at 82% 68%,rgba(112,48,150,.18),transparent 38%),radial-gradient(ellipse at 55% 12%,rgba(42,91,135,.10),transparent 34%);filter:blur(28px);animation:ambientDrift 25s ease-in-out infinite alternate}body:after{opacity:.2;background-image:radial-gradient(1px 1px at 20px 30px,#fff 98%,transparent),radial-gradient(1px 1px at 90px 110px,#fff 98%,transparent),radial-gradient(1px 1px at 160px 60px,#fff 98%,transparent),radial-gradient(1px 1px at 185px 145px,#e9a5ff 98%,transparent);background-size:210px 170px;animation:starDrift 58s linear infinite}#solarCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.88} @keyframes ambientDrift{0%{transform:translate3d(-2%,0,0) scale(1)}50%{transform:translate3d(2%,1%,0) scale(1.06)}100%{transform:translate3d(-1%,2%,0) scale(1.02)}}@keyframes starDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-90px,65px,0)}}@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}}
button,a{font:inherit}a{color:inherit;text-decoration:none}.top{height:66px;position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:linear-gradient(#070707eF,#07070700);pointer-events:none}.brand,.nav{pointer-events:auto}.brand{font-weight:700;letter-spacing:.16em;font-size:13px}.brand b{color:var(--red)}.nav{display:flex;gap:25px;font:10px 'DM Mono',monospace;color:#c1b9b3}.nav a:hover{color:var(--red)}
.hero{min-height:100vh;position:relative;padding:150px 7vw 70px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 68% 48%,#5b171333,transparent 35%),linear-gradient(120deg,#090909,#070707 65%);pointer-events:none}.hero-kicker{position:relative;color:var(--red);font:10px 'DM Mono',monospace;letter-spacing:.24em;text-transform:uppercase}.hero-title{position:relative;margin:20px 0 0;font-size:clamp(76px,17vw,240px);line-height:.76;letter-spacing:-.095em;font-weight:700;text-transform:uppercase;color:var(--red);max-width:1100px;overflow-wrap:anywhere}.hero-title .line2{color:transparent;-webkit-text-stroke:1px #e9ded8}.hero-lower{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;margin-top:48px;max-width:920px}.intro{font-size:clamp(17px,2.1vw,25px);line-height:1.25;max-width:470px}.intro strong{color:var(--red)}.smallcopy{font:10px/1.8 'DM Mono',monospace;color:var(--muted);max-width:370px}.scrollhint{position:absolute;bottom:28px;right:7vw;font:9px 'DM Mono',monospace;color:#827a75;letter-spacing:.16em}
.section{padding:100px 7vw;border-top:1px solid var(--line);position:relative}.section-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:35px}.number{font:clamp(40px,6vw,76px) 'DM Mono',monospace;color:var(--red)}.section h2{font-size:clamp(34px,6vw,76px);letter-spacing:-.07em;line-height:.9;margin:8px 0}.section-note{font:10px/1.7 'DM Mono',monospace;color:var(--muted);max-width:220px;text-align:right}
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.path-card{min-height:190px;border:1px solid #3a302d;padding:22px;position:relative;background:linear-gradient(145deg,#17100f,#0b0b0b);transition:.3s}.path-card:hover{transform:translateY(-5px);border-color:var(--red)}.path-card .id{font:11px 'DM Mono',monospace;color:var(--red)}.path-card h3{font-size:23px;letter-spacing:-.05em;margin:38px 0 8px}.path-card p{font-size:12px;line-height:1.6;color:#a9a19b;margin:0}.path-card .arrow{position:absolute;right:20px;top:17px;color:#73645e}
.history-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.history-card{padding:24px 18px;border-top:2px solid var(--red);background:#100e0d}.history-card b{font:30px 'DM Mono',monospace;color:var(--red)}.history-card p{font-size:13px;color:#b2aaa4;line-height:1.5}
.lab{display:grid;grid-template-columns:1fr 1fr;gap:14px}.codebox,.output{border:1px solid #39302d;background:#0c0b0b;padding:20px;min-height:185px}.codebox textarea{width:100%;height:125px;background:transparent;border:0;outline:0;resize:vertical;color:#c6e4a8;font:12px/1.7 'DM Mono',monospace}.run{border:1px solid var(--red);background:#2a0d0a;color:#ffb1a6;padding:9px 15px;font:10px 'DM Mono',monospace;cursor:pointer}.output{font:12px/1.8 'DM Mono',monospace;color:#b8c1b9;white-space:pre-wrap}.quiz{max-width:650px;border:1px solid #39302d;padding:22px}.quiz p{font-size:16px}.quiz button{display:block;margin:8px 0;padding:11px 14px;width:100%;text-align:left;color:#eee;background:#12100f;border:1px solid #39302d;cursor:pointer}.quiz button:hover{border-color:var(--red)}#feedback{color:#72d49c;font:11px 'DM Mono',monospace;min-height:18px}
footer{padding:32px 7vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#827a75;font:9px 'DM Mono',monospace;letter-spacing:.12em}
.build-status{position:fixed;z-index:25;left:50%;bottom:19px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;border:1px solid #51403a;background:#100d0deF;border-radius:30px;padding:9px 15px;box-shadow:0 8px 35px #0009;font:9px 'DM Mono',monospace;white-space:nowrap}.pulse{width:6px;height:6px;background:#65d69a;border-radius:50%;box-shadow:0 0 10px #65d69a}.build-status button{background:transparent;border:0;color:#ff897a;cursor:pointer;font:inherit}.cursor{position:fixed;z-index:40;pointer-events:none;left:0;top:0;transition:transform .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 2px 5px #000)}.cursor svg{width:21px;height:25px;display:block}.cursor-label{position:absolute;left:15px;top:14px;color:#080808;padding:4px 7px;border-radius:3px;font:9px 'DM Mono',monospace;white-space:nowrap}.typing-caret{display:inline-block;width:2px;height:.9em;background:var(--red);margin-left:3px;vertical-align:-.08em;animation:blink .7s infinite}@keyframes blink{50%{opacity:0}}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s,transform .55s}.reveal.show{opacity:1;transform:none}
@media(max-width:700px){.top{padding:0 5vw}.nav{gap:12px;font-size:9px}.hero{padding:125px 6vw 80px;min-height:90vh}.hero-lower{grid-template-columns:1fr;gap:13px}.section{padding:70px 6vw}.path-grid,.history-grid{grid-template-columns:1fr}.path-card{min-height:150px}.path-card h3{margin-top:25px}.lab{grid-template-columns:1fr}.section-note{max-width:130px}footer{padding-bottom:75px}.build-status{bottom:12px}}

.hero-art{position:relative;z-index:1;width:min(390px,62vw);height:clamp(150px,24vh,235px);margin:24px auto 4px;border:1px solid #e43b2f88;overflow:hidden;box-shadow:0 18px 65px #e43b2f22;transform:rotate(-1.2deg);animation:girlCuteFloat 5.2s ease-in-out infinite;will-change:transform;isolation:isolate}.hero-art:after{content:'✦  ♡  ✦';position:absolute;right:13px;top:12px;color:#ffd5d0;text-shadow:0 0 12px #ff7b91;font-size:15px;letter-spacing:7px;opacity:.78;pointer-events:none;animation:girlSparkle 3.4s ease-in-out infinite}.hero-art:before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#fff2 48%,transparent 60%);transform:translateX(-120%);animation:girlShimmer 7s ease-in-out infinite}
.hero-art img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block;filter:saturate(1.08);animation:girlPhotoSway 6.5s ease-in-out infinite;transform-origin:50% 70%}@keyframes girlCuteFloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}25%{transform:translateY(-5px) rotate(-.2deg)}50%{transform:translateY(-2px) rotate(1deg)}75%{transform:translateY(-6px) rotate(.2deg)}}@keyframes girlPhotoSway{0%,100%{transform:scale(1.015) translateY(0)}50%{transform:scale(1.055) translateY(-2px)}}@keyframes girlSparkle{0%,100%{opacity:.35;transform:translateY(0) scale(.92)}50%{opacity:1;transform:translateY(-4px) scale(1.08)}}@keyframes girlShimmer{0%,72%,100%{transform:translateX(-120%)}84%{transform:translateX(120%)}}@media(prefers-reduced-motion:reduce){.hero-art,.hero-art img,.hero-art:after,.hero-art:before{animation:none}}
.book-card{min-height:205px;display:flex;flex-direction:column;cursor:pointer}
.book-card h3{margin-top:24px}
.book-card .open-book{margin-top:auto;align-self:flex-start;border:1px solid var(--red);background:#270d0b;color:#ffb1a6;padding:9px 13px;font:10px 'DM Mono',monospace;cursor:pointer}
.book-reader{position:fixed;inset:0;z-index:80;background:#050505f5;backdrop-filter:blur(18px);display:none;flex-direction:column;padding:16px clamp(12px,4vw,48px) 20px}
.book-reader.active{display:flex}
.reader-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;width:100%;margin:0 auto 14px}
.reader-name{font:12px 'DM Mono',monospace;letter-spacing:.1em}.reader-sub{font:9px 'DM Mono',monospace;color:#9b928c;margin-top:5px}
.reader-close,.reader-btn{background:#141211;border:1px solid #4a3833;color:#f3f0ec;padding:10px 14px;border-radius:3px;font:10px 'DM Mono',monospace;cursor:pointer}
.book-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:1800px}
.real-book{width:min(100%,1000px);height:min(76vh,690px);min-height:350px;display:grid;grid-template-columns:1fr 1fr;position:relative;filter:drop-shadow(0 25px 38px #000b)}
.real-page{position:relative;background:#f0e8d9;color:#29231e;padding:clamp(22px,4vw,52px);overflow:hidden;box-shadow:inset 0 0 30px #7c62451c;font-family:Georgia,serif}
.real-page:first-child{border-right:1px solid #c9bda9;border-radius:5px 0 0 5px}.real-page:last-child{border-radius:0 5px 5px 0}
.real-page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0000000b,transparent 12%,transparent 88%,#0000000b)}
.real-page .chapter-label{font:9px 'DM Mono',monospace;color:#a34b3d;letter-spacing:.17em;margin-bottom:18px;text-transform:uppercase}
.real-page h2{font:600 clamp(22px,3vw,34px)/1.15 Georgia,serif;margin:0 0 22px;color:#211d19}
.real-page .page-copy{font:clamp(12px,1.2vw,15px)/1.8 Georgia,serif;white-space:pre-line}
.real-page .page-copy p{margin:0 0 12px}
.real-page .page-no{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#938675;font:9px 'DM Mono',monospace}
.reader-controls{width:min(100%,1000px);margin:14px auto 0;display:flex;align-items:center;gap:12px}
.reader-progress{height:3px;background:#292321;flex:1}.reader-progress i{height:100%;display:block;width:0;background:var(--red);transition:width .25s}
.reader-count{font:10px 'DM Mono',monospace;color:#aaa;white-space:nowrap}
@keyframes realPageTurn{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@media(max-width:700px){.hero-art{width:min(330px,78vw);height:155px}.real-book{height:72vh;grid-template-columns:1fr}.real-page:first-child{display:none}.real-page:last-child{border-radius:5px}.book-reader{padding:12px 8px}.reader-controls{gap:7px}.reader-btn{padding:9px 10px}}

.history-tools{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.history-tools button{background:#100e0d;border:1px solid #3b302d;color:#c8beb8;padding:8px 10px;font:9px 'DM Mono',monospace;cursor:pointer}.history-tools button.active,.history-tools button:hover{border-color:var(--red);color:#ff9f92;background:#260e0c}.history-tools input{background:#100e0d;border:1px solid #3b302d;color:#eee;padding:8px 10px;font:10px 'DM Mono',monospace;min-width:190px}.history-meta{font:10px 'DM Mono',monospace;color:#9a8e87;margin:0 0 14px}.history-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.history-card{min-height:178px;padding:17px 15px;position:relative}.history-card .story-tag{font:8px 'DM Mono',monospace;color:#e18b7f;letter-spacing:.1em;text-transform:uppercase}.history-card h3{font-size:15px;line-height:1.2;margin:12px 0 8px}.history-card p{font-size:11px;line-height:1.55;margin:0 0 12px}.history-card .story-source{position:absolute;bottom:10px;left:15px;right:15px;color:#80766f;font:8px 'DM Mono',monospace}.quiz-progress{display:flex;justify-content:space-between;color:#9f948d;font:10px 'DM Mono',monospace;margin-bottom:15px}.quiz-option{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 13px;background:#12100f;border:1px solid #39302d;color:#eee;cursor:pointer}.quiz-option.correct{border-color:#65d69a;color:#8cebb1}.quiz-option.wrong{border-color:var(--red);color:#ff9d91}.quiz-next{margin-top:14px;background:#270d0b;border:1px solid var(--red);color:#ffb1a6;padding:10px 14px;cursor:pointer;font:10px 'DM Mono',monospace}.quiz-feedback{font:11px/1.6 'DM Mono',monospace;color:#a9dcb9;margin-top:12px}.quiz-source{font:9px 'DM Mono',monospace;color:#817771;margin-top:8px}
@media(max-width:900px){.history-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.history-grid{grid-template-columns:1fr}}
.cursor{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .65s ease}

/* Topic-first history: compact tiles instead of a long wall of story cards */
.history-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
.history-tools .history-back{border:1px solid var(--red);background:#260e0c;color:#ffb1a6;padding:9px 12px;font:10px 'DM Mono',monospace;cursor:pointer}
.history-tools input{margin-left:auto;max-width:260px}
.history-grid.topic-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.topic-card{min-height:112px;text-align:left;padding:15px 16px;background:linear-gradient(145deg,#17110f,#0b0b0b);border:1px solid #342724;color:#f3ece8;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:transform .25s,border-color .25s,background .25s}
.topic-card:hover{transform:translateY(-4px);border-color:var(--red);background:#1b100e}
.topic-index{font:10px 'DM Mono',monospace;color:var(--red)}
.topic-card strong{font-size:14px;line-height:1.25;letter-spacing:-.02em;text-transform:uppercase}
.topic-card small{width:100%;display:flex;justify-content:space-between;color:#93857d;font:9px 'DM Mono',monospace}
.topic-card small span{color:#ff8275}
.topic-card.topic-ready{animation:topicPop .35s ease both}
@keyframes topicPop{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.history-grid.story-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.history-card{min-height:145px;padding:15px 14px}
.history-card h3{font-size:14px}
@media(max-width:900px){.history-grid.topic-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.history-grid.story-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.history-grid.topic-grid,.history-grid.story-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.topic-card{min-height:100px;padding:12px}.topic-card strong{font-size:12px}.history-card{min-height:150px;padding:12px}}

</style>

function placeCursor(i){const el=cursorEls[i],target=agentTargets[i];if(!el||!target)return;const r=target.getBoundingClientRect();const visible=r.width>0&&r.height>0&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth;if(!visible){el.style.opacity='0';return}el.style.visibility='visible';el.style.opacity='1';const x=Math.max(5,Math.min(innerWidth-35,r.left+r.width*(.2+((i%3)*.25))));const y=Math.max(5,Math.min(innerHeight-35,r.top+r.height*(.25+((i%2)*.4))));el.style.transform='translate('+x+'px,'+y+'px)'}
function move(i,target){let el=cursorEls[i];if(!el)return;let node=typeof target==='string'?$(target):target;if(!node||!node.getBoundingClientRect)return;agentTargets[i]=node;el.style.visibility='visible';placeCursor(i)}
function updateAgentPositions(){agentTargets.forEach((target,i)=>{if(target&&target.isConnected)placeCursor(i);else if(cursorEls[i])cursorEls[i].style.opacity='0'})}
window.addEventListener('scroll',updateAgentPositions,{passive:true});window.addEventListener('resize',updateAgentPositions);
function resetAgents(){agentTargets.fill(null);cursorEls.forEach(c=>{c.style.visibility='visible';c.style.transition='transform .55s cubic-bezier(.2,.8,.2,1),opacity .25s ease';c.style.opacity='0';c.style.transform='translate(-40px,-40px)'})}
function dismissAgents(){agentTargets.fill(null);const spots=[[12,12],[innerWidth-38,12],[innerWidth-38,innerHeight-42],[12,innerHeight-42],[innerWidth/2-10,8],[innerWidth/2-10,innerHeight-42],[8,innerHeight/2-12],[innerWidth-38,innerHeight/2-12]];cursorEls.forEach((c,i)=>{c.style.transform='translate('+spots[i][0]+'px,'+spots[i][1]+'px)';c.style.opacity='0'});setTimeout(()=>cursorEls.forEach(c=>c.style.visibility='hidden'),850)}
function count(){done=Math.min(100,done+1);$('statusCount').textContent=done+' / 100'}
async function typeInto(i,id,text,html=false){let el=$(id);move(i,el);el.innerHTML='';let span=document.createElement('span');el.append(span);let caret=document.createElement('i');caret.className='typing-caret';el.append(caret);for(let n=1;n<=text.length;n++){span.textContent=text.slice(0,n);if(n%3===0)sound(390+(i*80));await sleep(12,run)}caret.remove();if(html)el.innerHTML=text;count()}
async function addCard(i,container,markup){let node=document.createElement('div');node.className='reveal';node.innerHTML=markup;$(container).append(node);move(i,node);await sleep(130,run);node.classList.add('show');count()}
async function build(){run++;let id=run;done=0;paused=false;resetAgents();$('pause').textContent='Ⅱ PAUSE';$('statusText').textContent='AGENTS BUILDING THE PAGE';$('statusCount').textContent='0 / 100';$('kicker').textContent='';$('heroTitle').innerHTML='';$('intro').textContent='';$('smallcopy').textContent='';['n1','pathTitle','pathNote','pathGrid','n2','historyTitle','historyNote','historyGrid','n3','labTitle','labNote','n4','quizTitle','quizNote','quizBox'].forEach(x=>$(x).innerHTML='');$('output').textContent='OUTPUT WILL APPEAR HERE…';
try{
 $('statusText').textContent='NOVA IS CREATING THE HERO';
 await typeInto(0,'kicker','A CINEMATIC SPACE TO LEARN AND CREATE');
 move(0,'heroTitle');$('heroTitle').innerHTML='KARTHIK <span class="line2">CLASS ROOM</span>';count();await sleep(260,id);
 await typeInto(0,'intro','Three real course textbooks. One immersive place to learn.',false);
 await typeInto(3,'smallcopy','OPEN A CHAPTER. TURN THE PAGE. LEARN AT YOUR OWN PACE. YOUR CLASSROOM, REIMAGINED.',false);
 $('statusText').textContent='PIXEL IS BUILDING THE LEARNING PATH';
 await typeInto(1,'n1','01');await typeInto(1,'pathTitle','YOUR TEXTBOOKS');await typeInto(1,'pathNote','THREE SOURCE BOOKS · REBUILT AS INTERACTIVE PAGE-TURNING READERS.');
 const bookInfo=[
 ['01','INTRODUCTION','Computer basics, problem solving, programming, and computer history.'],
 ['02','ALGORITHMS & FLOWCHARTS','Learn how to plan a solution before writing a program.'],
 ['03','GENERATIONS OF PROGRAMMING LANGUAGES','Explore how programming languages evolved.']
 ];
 for(let j=0;j<bookInfo.length;j++){let d=bookInfo[j];let card=document.createElement('article');card.className='path-card book-card reveal';card.innerHTML='<span class="id">TEXTBOOK / '+d[0]+'</span><span class="arrow">↗</span><h3>'+d[1]+'</h3><p>'+d[2]+'</p><button class="open-book" onclick="openTextbook('+j+')">OPEN BOOK ↗</button>';$('pathGrid').append(card);move(j%2?1:3,card);await sleep(130,id);card.classList.add('show');count()}
 $('statusText').textContent='ATLAS IS BUILDING 100 TEXTBOOK STORIES';
 await typeInto(4,'n2','02');await typeInto(4,'historyTitle','COMPUTING: THE STORY SO FAR');await typeInto(4,'historyNote','100 SHORT READS BUILT FROM YOUR THREE PPS TEXTBOOKS · FILTER BY TOPIC OR SEARCH.');
 const categories=[...new Set(STORIES.map(s=>s[2]))];let activeHistory='';
 $('historyTools').innerHTML='<button class="history-back" id="historyBack" style="display:none">← ALL TOPICS</button><input id="historySearch" placeholder="SEARCH TOPICS OR STORIES…">';
 function renderHistory(){
   const q=$('historySearch').value.toLowerCase();
   if(!activeHistory){
     const topics=categories.filter(c=>!q||c.toLowerCase().includes(q)||STORIES.some(s=>s[2]===c&&s.slice(0,2).join(' ').toLowerCase().includes(q)));
     $('historyBack').style.display='none';
     $('historyMeta').textContent=categories.length+' TOPICS · 100 STORIES · CHOOSE A TOPIC';
     $('historyGrid').className='history-grid topic-grid';
     $('historyGrid').innerHTML=topics.map((c,i)=>'<button class="topic-card" data-topic="'+c+'"><span class="topic-index">'+String(i+1).padStart(2,'0')+'</span><strong>'+c+'</strong><small>'+STORIES.filter(s=>s[2]===c).length+' STORIES <span>↗</span></small></button>').join('');
     $('historyGrid').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{activeHistory=b.dataset.topic;renderHistory()});
   }else{
     const rows=STORIES.filter(s=>s[2]===activeHistory&&(!q||s.slice(0,4).join(' ').toLowerCase().includes(q)));
     $('historyBack').style.display='inline-flex';
     $('historyMeta').textContent=activeHistory.toUpperCase()+' · '+rows.length+' STORIES';
     $('historyGrid').className='history-grid story-grid';
     $('historyGrid').innerHTML=rows.map(s=>'<article class="history-card"><span class="story-tag">STORY '+String(STORIES.indexOf(s)+1).padStart(3,'0')+' · '+s[2]+'</span><h3>'+s[0]+'</h3><p>'+s[1]+'</p><div class="story-source">'+s[3]+'</div></article>').join('');
   }
 }
 $('historyBack').onclick=()=>{activeHistory='';$('historySearch').value='';renderHistory()};
 $('historySearch').oninput=renderHistory;
 renderHistory();
 const topicNodes=[...$('historyGrid').querySelectorAll('.topic-card')];
 for(let j=0;j<topicNodes.length;j++){move(j%8,topicNodes[j]);await sleep(65,id);topicNodes[j].classList.add('topic-ready')}
 $('historyMeta').textContent=categories.length+' TOPICS · 100 STORIES · CHOOSE A TOPIC';
 done=100;$('statusCount').textContent='100 / 100';
 $('statusText').textContent='ORBIT IS PREPARING 50 QUESTIONS FROM YOUR PDFs';
 await typeInto(6,'n3','03');await typeInto(6,'labTitle','WRITE. RUN. DISCOVER.');await typeInto(6,'labNote','PRACTISE THE IDEAS FROM CLASS. USE THE EXAMPLES AND EXPERIMENT WITH INPUT AND OUTPUT.');
 move(5,'code');await sleep(180,id);
 await typeInto(6,'n4','04');await typeInto(6,'quizTitle','YOUR PPS KNOWLEDGE CHECK');await typeInto(6,'quizNote','50 QUESTIONS FROM THE THREE TEXTBOOKS · INSTANT FEEDBACK · SCORE TRACKING.');
 let quizIndex=0,quizScore=0,quizAnswered=false;
 function renderQuiz(){const q=QUIZ[quizIndex];quizAnswered=false;$('quizBox').innerHTML='<div class="quiz-progress"><span>QUESTION '+(quizIndex+1)+' / 50</span><span>SCORE '+quizScore+'</span></div><p>'+q[0]+'</p>'+q[1].map((o,i)=>'<button class="quiz-option" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'<div id="quizFeedback" class="quiz-feedback"></div><div id="quizSource" class="quiz-source"></div><button id="quizNext" class="quiz-next" style="display:none">NEXT QUESTION →</button>';$('quizBox').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(quizAnswered)return;quizAnswered=true;const chosen=Number(b.dataset.answer),correct=chosen===q[2];if(correct)quizScore++;$('quizBox').querySelectorAll('[data-answer]').forEach((x,i)=>{x.disabled=true;if(i===q[2])x.classList.add('correct');else if(i===chosen)x.classList.add('wrong')});$('quizFeedback').textContent=(correct?'✓ CORRECT — ':'✕ NOT QUITE — ')+q[3];$('quizSource').textContent='SOURCE: '+q[4];$('quizNext').style.display='inline-block';$('quizNext').textContent=quizIndex===49?'VIEW YOUR RESULT':'NEXT QUESTION →';sound(correct?720:230)});$('quizNext').onclick=()=>{if(quizIndex===49){$('quizBox').innerHTML='<div class="quiz-progress"><span>QUIZ COMPLETE</span><span>50 QUESTIONS</span></div><h2>'+quizScore+' / 50</h2><p>'+(quizScore>=40?'Excellent work.':quizScore>=25?'Good effort. Review the source books and try again.':'Keep learning. Revisit the books and try again.')+'</p><button class="quiz-next" id="quizRestart">RESTART QUIZ ↻</button>';$('quizRestart').onclick=()=>{quizIndex=0;quizScore=0;renderQuiz()}}else{quizIndex++;renderQuiz()}}}
 renderQuiz();$('quizBox').classList.add('reveal','show');
 $('run').onclick=()=>{$('output').textContent=$('code').value.includes('printf')?'Hello, CVERSE!\\n\\nProcess finished with exit code 0.':'No output yet. Add a printf() statement.';sound(700)};
 $('statusText').textContent='KARTHIK CLASS ROOM IS BUILT · ALL 8 AGENTS SIGNING OFF';$('footerText').textContent='BUILT LIVE BY EIGHT CURSOR AGENTS';dismissAgents();sound(760);
}catch(e){if(e!==0)console.error(e)}
}

window.openTextbook=function(i){activeBook=i;bookPage=0;$('readerName').textContent=BOOKS[i].title.toUpperCase();$('readerSub').textContent='SOURCE TEXT · '+BOOKS[i].pages.length+' PAGES';$('bookReader').classList.add('active');document.body.style.overflow='hidden';renderBookSpread()};
function closeTextbook(){$('bookReader').classList.remove('active');document.body.style.overflow=''}
function pageHtml(p,n){if(!p)return '<div class="chapter-label">KARTHIK CLASS ROOM</div><h2>Welcome</h2><div class="page-copy"><p>Choose a textbook to begin reading.</p></div><div class="page-no">—</div>';let paras=(p.lines||[]).filter(Boolean).map(t=>'<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>').join('');return '<div class="chapter-label">'+BOOKS[activeBook].title+'</div><h2>'+p.heading.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</h2><div class="page-copy">'+(paras||'<p>Continue to the next page.</p>')+'</div><div class="page-no">'+n+'</div>'}
function renderBookSpread(){let b=BOOKS[activeBook];$('leftPage').innerHTML=pageHtml(b.pages[bookPage-1],bookPage);$('rightPage').innerHTML=pageHtml(b.pages[bookPage],bookPage+1);$('readerPrev').disabled=bookPage===0;$('readerNext').disabled=bookPage>=b.pages.length-1;$('readerCount').textContent=(bookPage+1)+' / '+b.pages.length;$('readerBar').style.width=((bookPage+1)/b.pages.length*100)+'%'}
async function turnBook(dir){if(turning)return;let b=BOOKS[activeBook],n=bookPage+dir;if(n<0||n>=b.pages.length)return;turning=true;let page=$('rightPage');page.style.transformOrigin=dir>0?'left center':'right center';page.style.transition='transform .55s ease';page.style.transform='rotateY('+(dir>0?-18:18)+'deg)';await new Promise(r=>setTimeout(r,250));bookPage=n;renderBookSpread();page=$('rightPage');page.style.transform='';page.style.transition='';turning=false}
$('readerClose').onclick=closeTextbook;$('readerPrev').onclick=()=>turnBook(-1);$('readerNext').onclick=()=>turnBook(1);
document.addEventListener('keydown',e=>{if(!$('bookReader').classList.contains('active'))return;if(e.key==='Escape')closeTextbook();if(e.key==='ArrowRight')turnBook(1);if(e.key==='ArrowLeft')turnBook(-1)});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};
$('restart').onclick=()=>{run++;build()};
build();
})();
